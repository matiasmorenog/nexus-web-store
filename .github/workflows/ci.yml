name: CI

on:
  pull_request:
    branches: [development, main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    # Static name — required by branch protection. Do not use a dynamic
    # `name:` expression: GitHub leaves it unevaluated when the job is skipped
    # (shows the raw expression as the check name).
    name: lint-and-typecheck
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Dummy URLs — only required for `prisma generate` (no DB connection in CI).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # Separate job with a static name so draft PRs get a clear label.
  # (A dynamic name on the skipped real job would show the raw expression.)
  lint-and-typecheck-draft:
    name: lint-and-typecheck (draft)
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Draft PR — CI deferred
        run: echo "Draft PR; lint-and-typecheck runs when marked ready for review."
